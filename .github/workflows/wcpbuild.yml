name: WCP Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version number, e.g. 1.10.3.0 (will become pandxvk-1.10.3.0-<sha> in profile.json)'
        required: true
        type: string
        default: '1.10.3'
      version_code:
        description: 'Build number (auto if blank)'
        required: false
        type: string
        default: ''
      release_description:
        description: 'Short description for profile.json'
        required: false
        type: string
        default: 'panDXVK - DXVK fork for PanVK/Mali-G720'

permissions:
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Resolve version inputs
        id: version
        run: |
          VNAME="${{ inputs.version_name }}"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"

          # Auto versionCode if not provided: use timestamp
          VCODE="${{ inputs.version_code }}"
          if [ -z "$VCODE" ]; then
            VCODE=$(date +%s)
          fi
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Get build SHA and run ID for this commit
        id: get-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve against THIS commit, not "the latest successful run".
          # Picking the newest build.yml run means a WCP dispatched on commit X
          # can silently package commit Y's DLLs, and it fails outright when
          # that run's artifacts have been purged (seen 2026-10-06: the newest
          # run was 51bb8827, whose artifacts had been deleted with it).
          TARGET="${{ github.sha }}"
          RUNS=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch main \
            --status success --limit 20 --json headSha,databaseId)
          MATCH=$(printf '%s' "$RUNS" | python3 -c '
          import sys, json
          target = sys.argv[1]
          for r in json.load(sys.stdin):
              if r["headSha"] == target:
                  print(r["headSha"], r["databaseId"])
                  break
          ' "$TARGET")
          if [ -z "$MATCH" ]; then
            echo "::error::No successful build.yml run found for commit ${TARGET:0:7}."
            echo "::error::Trigger Build DXVK (x64 + x32) on this commit first."
            exit 1
          fi
          FULL_SHA=$(printf '%s' "$MATCH" | cut -d' ' -f1)
          RUN_ID=$(printf '%s' "$MATCH" | cut -d' ' -f2)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.total_count')
          if [ "$COUNT" = "0" ]; then
            echo "::error::Build run for ${TARGET:0:7} has no artifacts (purged or expired)."
            echo "::error::Re-run Build DXVK (x64 + x32) on this commit."
            exit 1
          fi
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download build DLLs
        uses: actions/download-artifact@v4
        with:
          name: dxvk-${{ steps.get-sha.outputs.full_sha }}
          path: ./workdir
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-sha.outputs.run_id }}

      - name: Restructure for WCP
        run: |
          cd ./workdir
          VDIR="$(ls -d dxvk-*/)"
          mv "$VDIR/x64" ./
          mv "$VDIR/x32" ./
          rm -rf "$VDIR"

      - name: Prepare DLL directories
        run: |
          cd ./workdir
          mv x64 system32
          mv x32 syswow64

      - name: Package WCP
        env:
          VNAME: ${{ steps.version.outputs.version_name }}
          VCODE: ${{ steps.version.outputs.version_code }}
          VDESC: ${{ inputs.release_description }}
        run: |
          cd ./workdir
          python3 - << 'PYEOF'
          import glob, json, os, sys

          # The manifest is derived from what the build actually shipped.
          # It was previously hardcoded, and it drifted: it listed d3d10.dll and
          # d3d10_1.dll (targets this tree never builds — src/d3d10/meson.build
          # only declares d3d10core) while omitting d3d8.dll and ddraw.dll, which
          # are shipped. Four phantom sources broke every import.
          folders = (("system32", "${system32}"), ("syswow64", "${syswow64}"))
          files = []
          for folder, prefix in folders:
              dlls = sorted(glob.glob(os.path.join(folder, "*.dll")))
              if not dlls:
                  sys.exit(f"ERROR: {folder}/ contains no DLLs — the build artifact did not land.")
              for dll in dlls:
                  name = os.path.basename(dll)
                  files.append({"source": dll, "target": f"{prefix}/{name}"})
              names = ", ".join(os.path.basename(d) for d in dlls)
              print(f"{folder}: {len(dlls)} DLLs -> {names}")

          profile = {
              "type": "DXVK",
              "versionName": f"pandxvk-{os.environ['VNAME']}",
              "versionCode": int(os.environ["VCODE"]),
              "description": os.environ["VDESC"],
              "files": files,
          }
          with open("profile.json", "w", encoding="utf-8") as fh:
              json.dump(profile, fh, indent=2)
              fh.write("\n")
          print(f"profile.json generated from archive contents: {len(files)} entries")
          PYEOF
          tar --zstd -cf "../pandxvk-${{ steps.version.outputs.version_name }}.wcp" \
            system32/ syswow64/ profile.json

      - name: Wrap WCP in zip
        run: |
          python3 -c "
          import zipfile, glob
          wcp_files = glob.glob('*.wcp')
          if not wcp_files:
              raise SystemExit('ERROR: No .wcp files found in $GITHUB_WORKSPACE')
          print(f'Packing {len(wcp_files)} file(s): {wcp_files}')
          with zipfile.ZipFile('wcp.zip', 'w', zipfile.ZIP_STORED) as zf:
              for f in wcp_files:
                  zf.write(f)
          "
          ls -lh wcp.zip

      - name: Upload WCP
        uses: actions/upload-artifact@v4
        with:
          name: wcp-pandxvk-${{ steps.version.outputs.version_name }}-${{ steps.get-sha.outputs.sha }}
          path: ./wcp.zip

      - name: Upload panDXVK config
        uses: actions/upload-artifact@v4
        with:
          name: pandxvk-config-${{ steps.version.outputs.version_name }}-${{ steps.get-sha.outputs.sha }}
          path: pandxvk/
