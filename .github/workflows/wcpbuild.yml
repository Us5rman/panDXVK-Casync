name: WCP Build

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: 'Short description for profile.json'
        required: false
        type: string
        default: 'panDXVK - DXVK fork for PanVK/Mali-G720'

permissions:
  actions: read

env:
  VERSION_NAME: Casync
  VERSION_CODE: 1
  FILE_BASE: Casync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install zstd
        run: sudo apt-get update -y && sudo apt-get install -y zstd

      - name: Get latest build SHA and run ID
        id: get-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo ${{ github.repository }} --workflow build.yml --branch main \
            --status success --limit 20 --json headSha,databaseId)
          LIST=$(printf '%s' "$RUNS" | python3 -c '
          import sys, json
          for r in json.load(sys.stdin):
              print(r["headSha"], r["databaseId"])
          ')
          FULL_SHA=""
          RUN_ID=""
          while read -r SHA ID; do
            [ -z "$ID" ] && continue
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$ID/artifacts" --jq '.total_count')
            if [ "$COUNT" != "0" ]; then
              FULL_SHA="$SHA"
              RUN_ID="$ID"
              break
            fi
          done <<< "$LIST"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build.yml run with artifacts found on main."
            echo "::error::Run Build DXVK (x64 + x32) first."
            exit 1
          fi
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download build DLLs
        uses: actions/download-artifact@v4
        with:
          name: dxvk-${{ steps.get-sha.outputs.full_sha }}
          path: ./workdir
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-sha.outputs.run_id }}

      - name: Restructure for WCP
        run: |
          cd ./workdir
          VDIR="$(ls -d dxvk-*/)"
          mv "$VDIR/x64" ./
          mv "$VDIR/x32" ./
          rm -rf "$VDIR"

      - name: Prepare DLL directories
        run: |
          cd ./workdir
          mv x64 system32
          mv x32 syswow64

      - name: Package WCP
        run: |
          cd ./workdir
          cat > profile.json << 'JSONEOF'
          {
            "type": "DXVK",
            "versionName": "${{ env.VERSION_NAME }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "description": "${{ inputs.release_description }}",
            "files": [
              {"source": "system32/d3d9.dll",      "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10.dll",     "target": "${system32}/d3d10.dll"},
              {"source": "system32/d3d10_1.dll",   "target": "${system32}/d3d10_1.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll",     "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll",      "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d9.dll",      "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10.dll",     "target": "${syswow64}/d3d10.dll"},
              {"source": "syswow64/d3d10_1.dll",   "target": "${syswow64}/d3d10_1.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll",     "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll",      "target": "${syswow64}/dxgi.dll"}
            ]
          }
          JSONEOF
          tar -cf ../pandxvk.tar system32/ syswow64/ profile.json
          zstd --ultra -7 -f ../pandxvk.tar -o "../${{ env.FILE_BASE }}.wcp"
          rm ../pandxvk.tar
          ls -l ../pandxvk-*.wcp

      - name: Upload WCP
        uses: actions/upload-artifact@v4
        with:
          name: wcp-${{ env.FILE_BASE }}-${{ steps.get-sha.outputs.sha }}
          path: ./${{ env.FILE_BASE }}.wcp
          compression-level: 0

      - name: Upload panDXVK config
        uses: actions/upload-artifact@v4
        with:
          name: pandxvk-config-${{ env.FILE_BASE }}-${{ steps.get-sha.outputs.sha }}
          path: pandxvk/
          
