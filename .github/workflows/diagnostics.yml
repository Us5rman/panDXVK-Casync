name: Build diagnostics (NDEBUG off)

# Separate from build.yml on purpose.
#
# build.yml builds with `-Db_ndebug=true` (hardcoded in package-release.sh),
# which compiles OUT every #ifndef NDEBUG instrumentation - including the
# bind telemetry in dxvk_cmdlist. A diagnostics build passes --diagnostics to
# clear that, so debug-only counters are actually present while the build
# stays buildtype=release.
#
# It is a distinct workflow rather than an input on build.yml because
# wcpbuild.yml resolves "the latest successful build.yml run" and downloads
# artifact dxvk-<sha> from it. A diagnostics run would match that query but
# only carries dxvk-diag-<sha>, which would break release packaging. Keeping
# the workflows separate means wcpbuild can never see this build.
#
# x64 only: the target device runs a 64-bit container, so x32 adds build time
# without adding anything the A/B needs.

on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # Compute a sanitized version string (no / in branch names)
  # ----------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Compute version
        id: set_version
        run: |
          SANITIZED_REF="${GITHUB_REF_NAME//\//-}"
          echo "version=${SANITIZED_REF}-${GITHUB_SHA:0:7}-diag" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Host-native ASTC spec gate (rmchk)
  # Same gate as build.yml - a diagnostics build must not be allowed to
  # skip it, otherwise we could measure a build that would never ship.
  # ----------------------------------------------------------------
  gate-astc-spec:
    name: ASTC spec gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rmchk
        run: g++ -O2 -Wall -Wextra -o rmchk tests/host/rmchk.cpp

      - name: Run rmchk
        run: ./rmchk

  # ----------------------------------------------------------------
  # MinGW x64 cross-build, NDEBUG off
  # ----------------------------------------------------------------
  build-mingw-x64-diag:
    name: MinGW x64 (diagnostics)
    runs-on: ubuntu-latest
    needs: [setup, gate-astc-spec]
    container:
      image: fedora:44
      options: --user root
    steps:
      # actions/checkout falls back to downloading a plain tarball when git is
      # absent, which leaves no .git directory - and meson's vcs_tag then has
      # nothing to describe and silently falls back to the project version.
      # Install git first so the checkout is a real clone with tags.
      - name: Install git for checkout
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repository as "dubiously owned" and every git
      # command fails - which is what makes meson's vcs_tag fall back to the
      # project version and drop the panVK release suffix from the build.
      - name: Trust the repository for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            dnf install -y \
              git \
              mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-crt \
              mingw64-winpthreads mingw64-vulkan-headers mingw64-spirv-headers \
              glslang meson ninja-build pkgconf && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Version source
        run: |
          echo ".git present : $(test -d .git && echo yes || echo NO)"
          echo "git on PATH  : $(command -v git || echo NO)"
          echo "HEAD         : $(git rev-parse --short HEAD 2>&1)"
          echo "describe     : $(git describe --tags --dirty=+ 2>&1)"
          echo "tags at HEAD : $(git tag --points-at HEAD 2>&1 | tr '\n' ' ')"

      # --diagnostics is what clears -Db_ndebug. Without it this job would
      # produce an ordinary release build under a diagnostics name, and the
      # bind stats would silently never appear - the exact false negative
      # the protocol tells the tester to report rather than re-run.
      - name: Build x64 diagnostics
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --64-only --build-id --diagnostics

      # The suffix must stay visible in the artifact name so a diagnostics
      # package can never be dropped in as a release one.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-diag-${{ github.sha }}
          path: build/
          if-no-files-found: error
