name: Build DXVK (x64 + x32)

on:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # Compute a sanitized version string (no / in branch names)
  # ----------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Compute version
        id: set_version
        run: |
          SANITIZED_REF="${GITHUB_REF_NAME//\//-}"
          echo "version=${SANITIZED_REF}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Host-native ASTC spec gate (rmchk)
  # Independent decoder written from GL_KHR_texture_compression_astc_ldr
  # Appendix C and cross-checked against basisu's shipped UASTC mode table.
  # It shares no code with the encoder under test, so it can actually catch
  # a wrong-but-legal block mode - the defect class that shipped in
  # v1.10.3-panVK.6 (0x51, haze) and v1.10.3-panVK.7 (0x242, corruption).
  # Runs before the cross-builds so a failing gate blocks them.
  # ----------------------------------------------------------------
  gate-astc-spec:
    name: ASTC spec gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rmchk
        run: g++ -O2 -Wall -Wextra -o rmchk tests/host/rmchk.cpp

      # Exits non-zero if the reference R reading stops reproducing basisu,
      # if the shipped block mode is not 0x241, or if the endpoint fit drifts.
      - name: Run rmchk
        run: ./rmchk

  # ----------------------------------------------------------------
  # MinGW x64 cross-build
  # ----------------------------------------------------------------
  build-mingw-x64:
    name: MinGW x64
    runs-on: ubuntu-latest
    needs: [setup, gate-astc-spec]
    container:
      image: fedora:44
      options: --user root
    steps:
      # actions/checkout falls back to downloading a plain tarball when git is
      # absent, which leaves no .git directory - and meson's vcs_tag then has
      # nothing to describe and silently falls back to the project version.
      # Install git first so the checkout is a real clone with tags.
      - name: Install git for checkout
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            dnf install -y \
              git \
              mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-crt \
              mingw64-winpthreads mingw64-vulkan-headers mingw64-spirv-headers \
              glslang meson ninja-build pkgconf && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Version source
        run: |
          echo ".git present : $(test -d .git && echo yes || echo NO)"
          echo "git on PATH  : $(command -v git || echo NO)"
          echo "HEAD         : $(git rev-parse --short HEAD 2>&1)"
          echo "describe     : $(git describe --tags --dirty=+ 2>&1)"
          echo "tags at HEAD : $(git tag --points-at HEAD 2>&1 | tr '\n' ' ')"

      - name: Build x64
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --64-only --build-id

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-x64-${{ github.sha }}
          path: build/
          if-no-files-found: error

  # ----------------------------------------------------------------
  # MinGW x32 cross-build
  # ----------------------------------------------------------------
  build-mingw-x32:
    name: MinGW x32
    runs-on: ubuntu-latest
    needs: [setup, gate-astc-spec]
    container:
      image: fedora:44
      options: --user root
    steps:
      # actions/checkout falls back to downloading a plain tarball when git is
      # absent, which leaves no .git directory - and meson's vcs_tag then has
      # nothing to describe and silently falls back to the project version.
      # Install git first so the checkout is a real clone with tags.
      - name: Install git for checkout
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            dnf install -y \
              git \
              mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-crt \
              mingw32-winpthreads mingw32-vulkan-headers mingw32-spirv-headers \
              glslang meson ninja-build pkgconf && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Version source
        run: |
          echo ".git present : $(test -d .git && echo yes || echo NO)"
          echo "git on PATH  : $(command -v git || echo NO)"
          echo "HEAD         : $(git rev-parse --short HEAD 2>&1)"
          echo "describe     : $(git describe --tags --dirty=+ 2>&1)"
          echo "tags at HEAD : $(git tag --points-at HEAD 2>&1 | tr '\n' ' ')"

      - name: Build x32
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "${{ needs.setup.outputs.version }}" \
            build \
            --no-package --32-only --build-id

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-x32-${{ github.sha }}
          path: build/
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Merge x64 + x32 into a single release artifact
  # ----------------------------------------------------------------
  merge-artifacts:
    name: Merge artifacts
    runs-on: ubuntu-latest
    needs: [build-mingw-x64, build-mingw-x32]
    steps:
      - name: Merge
        uses: actions/upload-artifact/merge@v4
        with:
          name: dxvk-${{ github.sha }}
          pattern: dxvk-*-${{ github.sha }}
          delete-merged: true
