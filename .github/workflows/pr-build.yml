name: PR Build Check

# Deliberately a SEPARATE workflow rather than a `pull_request` trigger added
# to build.yml. wcpbuild.yml resolves the DLLs it packages with
#
#   gh run list --workflow build.yml --branch main --status success
#
# A pull_request run of build.yml reports headBranch = the PR head branch,
# and a fork whose branch is itself called "main" therefore looks exactly
# like a successful build of our main. Dispatching WCP afterwards would then
# package the PR's DLLs into a release - the same wrong-SHA class of defect
# that was hit on 2026-10-06 with the purged 51bb8827 artifacts. Keeping the
# check in its own file means PR runs never appear in that listing at all.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Host-native ASTC spec gate (rmchk)
  # Same gate as build.yml. It shares no code with the encoder under test,
  # so it is the one check that can catch a wrong-but-legal block mode -
  # the defect class that shipped in v1.10.3-panVK.6 (0x51, haze) and
  # v1.10.3-panVK.7 (0x242, corruption). Runs before the cross-builds so a
  # failing gate blocks them and wastes no MinGW time.
  # ----------------------------------------------------------------
  gate-astc-spec:
    name: PR ASTC spec gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rmchk
        run: g++ -O2 -Wall -Wextra -o rmchk tests/host/rmchk.cpp

      # Exits non-zero if the reference R reading stops reproducing basisu,
      # if the shipped block mode is not 0x241, or if the endpoint fit drifts.
      - name: Run rmchk
        run: ./rmchk

  # ----------------------------------------------------------------
  # MinGW x64 cross-build
  # ----------------------------------------------------------------
  build-mingw-x64:
    name: PR MinGW x64
    runs-on: ubuntu-latest
    needs: [gate-astc-spec]
    if: github.event.pull_request.draft == false
    container:
      image: fedora:44
      options: --user root
    steps:
      # actions/checkout falls back to downloading a plain tarball when git is
      # absent, which leaves no .git directory - and meson's vcs_tag then has
      # nothing to describe and silently falls back to the project version.
      # Install git first so the checkout is a real clone with tags.
      - name: Install git for checkout
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repository as "dubiously owned" and every git
      # command fails - which is what makes meson's vcs_tag fall back to the
      # project version and drop the panVK release suffix from the build.
      - name: Trust the repository for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            dnf install -y \
              git \
              mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-crt \
              mingw64-winpthreads mingw64-vulkan-headers mingw64-spirv-headers \
              glslang meson ninja-build pkgconf && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Version source
        run: |
          echo ".git present : $(test -d .git && echo yes || echo NO)"
          echo "git on PATH  : $(command -v git || echo NO)"
          echo "HEAD         : $(git rev-parse --short HEAD 2>&1)"
          echo "describe     : $(git describe --tags --dirty=+ 2>&1)"
          echo "tags at HEAD : $(git tag --points-at HEAD 2>&1 | tr '\n' ' ')"

      - name: Build x64
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" \
            build \
            --no-package --64-only

  # ----------------------------------------------------------------
  # MinGW x32 cross-build
  # Runs in parallel with x64; neither gates the other, so an x32-only
  # failure still reports alongside a passing x64 instead of being hidden
  # behind it.
  # ----------------------------------------------------------------
  build-mingw-x32:
    name: PR MinGW x32
    runs-on: ubuntu-latest
    needs: [gate-astc-spec]
    if: github.event.pull_request.draft == false
    container:
      image: fedora:44
      options: --user root
    steps:
      - name: Install git for checkout
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the repository for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            dnf install -y \
              git \
              mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-crt \
              mingw32-winpthreads mingw32-vulkan-headers mingw32-spirv-headers \
              glslang meson ninja-build pkgconf && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - name: Version source
        run: |
          echo ".git present : $(test -d .git && echo yes || echo NO)"
          echo "git on PATH  : $(command -v git || echo NO)"
          echo "HEAD         : $(git rev-parse --short HEAD 2>&1)"
          echo "describe     : $(git describe --tags --dirty=+ 2>&1)"
          echo "tags at HEAD : $(git tag --points-at HEAD 2>&1 | tr '\n' ' ')"

      - name: Build x32
        run: |
          chmod +x package-release.sh
          ./package-release.sh \
            "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" \
            build \
            --no-package --32-only
